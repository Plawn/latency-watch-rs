variables:
  IDENTITY_URL: https://identity.blumana.app
  API_BASE_URL: https://api2.temp2-webservice.blumana.app

listen_addr: "0.0.0.0:9090"

scrape_interval_seconds: 15

auths:
  # - name: Bearer
  #   config:
  #     type: Bearer
  #     token: TOKEN

  - name: Blumana
    config:
      type: OAuth
      url: ${IDENTITY_URL}
      realm: blumana
      client_id: front
      user: ${BLU_USERNAME}
      pass: ${BLU_PASSWORD}

routes:
  - name: "Self"
    url: ${API_BASE_URL}/user/self
    auth: Blumana